<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All questions_HDSF_2025-2026</title>

    <style>
       :root {
            --bg-body: #121212;
            --text-main: #f1f5f9;
            --text-opts: #f1f5f9;
            --header-bg: #1e293b;
            --header-text: #38bdf8;
            --border-color: #26292b;
            --input-bg: #1a1c1e;
            --input-border: #2a2f36;
            --ans-bg: #1e293b;
            --ans-text: #f0cf6a;
            --filter-bg: transparent;
            --filter-txt-active: #1A1A1A;
            --filter-bg-active:  #DDDDDD;
            --filter-border-active: #DDDDDD;
            --ans-btn-bg: #D3D3D3;
            --ans-btn-txt: #1A1A1A;
            --menu-bg: #1e293b;
            --menu-border: #2a2f36;
            --menu-hover: #263347;
        }

        [data-theme="light"] {
            --bg-body: #ffffff;
            --text-main: #000000;
            --text-opts: #333333;
            --header-bg: #2D2D2D;
            --header-text: #ffffff;
            --border-color: #e0e0e0;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --ans-bg: #eef6e4;
            --ans-text: #2e7d32;
            --filter-bg: transparent;
            --filter-txt-active:  #ffffff;
            --filter-bg-active: #4D4D4D;
            --filter-border-active: #4D4D4D;
            --ans-btn-bg:  #555555;
            --ans-btn-txt: #ffffff;
            --menu-bg: #ffffff;
            --menu-border: #e0e0e0;
            --menu-hover: #f5f5f5;
        }

        .filter-btn.active {
            background-color: var(--filter-bg-active);
            color: var(--filter-txt-active);
            border-color: var(--filter-border-active);
        }

        body {
            -webkit-user-select: none;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header { 
            text-align: center; 
            margin-bottom: 20px;
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Top action row: Back on left, theme+save on right */
        .top-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .top-action-left {
            display: flex;
            gap: 8px;
        }

        .top-action-right {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            height: 40px;
            padding: 0 14px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            opacity: 0.85;
        }

        .icon-btn svg {
            flex-shrink: 0;
        }

        /* Active state for the Saved filter button */
        .icon-btn.saved-active {
            background-color: #facc15;
            color: #000;
            border-color: #eab308;
        }

        .save-badge {
            background-color: #eab308;
            color: #000;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 999px;
            padding: 1px 6px;
            margin-left: 2px;
        }

        .icon-btn.saved-active .save-badge {
            background-color: #000;
            color: #eab308;
        }

        .controls-row { display: flex; gap: 12px; margin-bottom: 15px; }

        .search-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .search-wrapper svg {
            position: absolute;
            left: 12px;
            color: var(--text-opts);
            z-index: 1;
        }

        #search-input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            font-size: 1.1rem;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 7px;
            outline: none;
        }

        .filter-container {
            background: transparent;
            border: none;
            padding: 0;
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-wrap: nowrap;
            max-width: 100%;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }

        .filter-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 0.84rem;
            font-weight: 700;
            transition: all 0.2s;
            flex: 0 0 auto;
            white-space: nowrap;
            margin-bottom: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        .divider { border: none; margin-bottom: 12px; }

        .q-block {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
            position: relative;
        }

        .q-block:last-child { border-bottom: none; }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .q-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; line-height: 1.5; flex: 1; }
        .opts { list-style-type: none; padding: 0; line-height: 1.7; font-size: 1.05rem; color: var(--text-opts); margin-bottom: 15px; }

        .ans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ans-btn {
            background-color: var(--ans-btn-bg);
            color: var(--ans-btn-txt);
            border: none;
            padding: 7px 20px;
            border-radius: 4px;
            margin-top: 20px;
            font-weight: 650;
            font-size: 16px;
            cursor: pointer;
        }

        .q-block.revealed .ans-btn {
            background-color: var(--ans-bg);
            color: var(--ans-text);
            font-weight: 700;
            padding: 7px 12px;
            font-size: 16px;
        }

        mark { background-color: #f0cf6a; color: #000; }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-opts);
            font-size: 1.15rem;
            font-weight: 500;
            opacity: 0.6;
            box-sizing: border-box;
            width: 100%;
            display: block; 
        }

        .section-heading-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .mcq-count-badge {
            font-size: 0.70rem;
            font-weight: 700;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 2px 5px;
            border-radius: 3px;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        /* Three dots menu */
        .dots-menu-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .dots-btn {
            background: none;
            border: none;
            color: var(--text-opts);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.55;
            transition: opacity 0.2s, background 0.2s;
            margin-top: 2px;
        }

        .dots-btn:hover {
            opacity: 1;
            background-color: var(--input-bg);
        }

        .dots-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 4px);
            background-color: var(--menu-bg);
            border: 1px solid var(--menu-border);
            border-radius: 9px;
            min-width: 155px;
            z-index: 999;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.28);
        }

        .dots-dropdown.open {
            display: block;
            animation: dropIn 0.15s ease;
        }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .dots-dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 16px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-main);
            transition: background 0.15s;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .dots-dropdown-item:hover {
            background-color: var(--menu-hover);
        }

        .dots-dropdown-item svg {
            flex-shrink: 0;
            opacity: 0.8;
        }

        /* Divider inside dropdown */
        .dots-divider {
            height: 1px;
            background-color: var(--menu-border);
            margin: 0;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            color: #f1f5f9;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 9999;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 18px rgba(0,0,0,0.35);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Saved star indicator on q-block */
        .q-block.is-saved .dots-btn {
            opacity: 1;
            color: #eab308;
        }
    </style>

</head>

<body oncontextmenu="return false;">

<div class="container">
    <div class="header">
        <div style="text-align: left;">
            <h3 style="margin: 0; font-size: 1.4rem;">End-Rotation</h3>
            <p style="margin: 2px 0 0; font-size: 0.9rem; opacity: 0.8;">Anatomy 🦴 • 2025-2026</p>
        </div>
    </div>

    <!-- Top action row: Back left | Saved + Theme right -->
    <div class="top-action-row">
        <div class="top-action-left">
            <!-- Back button -->
            <button class="icon-btn" onclick="window.location.href='index.html'">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                Back
            </button>
        </div>
        <div class="top-action-right">
            <!-- Saved filter button -->
            <button class="icon-btn" id="saved-toggle-btn" onclick="toggleSavedFilter()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
                Saved
                <span class="save-badge" id="saved-count-badge" style="display:none">0</span>
            </button>
            <!-- Dark/Light toggle -->
            <button class="icon-btn" onclick="toggleTheme()">
                <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </div>

    <div class="controls-row">
        <div class="search-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-input" placeholder="Search questions..." onkeyup="handleSearch()">
        </div>
    </div>

    <div class="filter-container" id="filter-bar"></div>

    <hr class="divider">
    <div id="quiz-content"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>

const allQuestions = [
  { n: 1, s: "Introduction to anatomy", q: "Where is superficial fascia?", o: ["A. Under skin the fatty tissue","B. Deep to deep fascia","C. Between muscle layers","D. Between skin layers","E. Around internal organs"], a: "A" },
  { n: 2, s: "Introduction to anatomy", q: "A structure is anterior to another when it is.......", o: ["A. Behind it","B. Below it","C. Lateral to it","D. In front of it","E. Above it"], a: "D" },
  { n: 3, s: "Introduction to anatomy", q: "Which of the following is correct about superficial fascia:", o: ["A. Dense connective tissue covering muscles","B. Fatty layer located directly under the skin","C. Fibrous layer around organs","D. Cartilaginous supportive tissue","E. Elastic tissue of joints"], a: "B" },
  { n: 4, s: "Introduction to anatomy", q: "Adduction is .........", o: ["A. Movement away from the midline in sagittal plane","B. Rotation around long axis","C. Circular movement of a joint","D. Forward movement in sagittal plane","E. Movement of a part of body toward the midline in coronal plane"], a: "E" },
  { n: 5, s: "Introduction to anatomy", q: "What's the type of fascia found in parotid gland? (Not in the lecture)", o: ["A. Pretracheal fascia","B. Prevertebral fascia","C. Investing fascia","D. Deep cervical fascia","E. Buccopharyngeal fascia"], a: "C" },
];

const filterLectures = [
  { label: "All",                                    val: "All" },
  { label: "Introduction to Anatomy 🦴",             val: "Introduction to anatomy" },
  { label: "Axial skeleton 💀",                      val: "Axil skeleton" },
  { label: "Appendicular skeleton 🦴",               val: "Appendicular system" },
  { label: "Joints 🔗",                              val: "Joints" },
  { label: "Muscles 💪",                             val: "Muscles" },
  { label: "Respiratory system 🫁",                  val: "Respiratory system" },
  { label: "Digestive system 💊",                    val: "Digestive system" },
  { label: "Cardiovascular system 🫀",               val: "Cardiovascular system" },
  { label: "Nervous system 🧠",                      val: "Nervous system" },
  { label: "Genitourinary system 🫘",                val: "Genitourinary system" },
  { label: "Autonomic nervous system 🧠",            val: "Autonomic nervous system" },
];

let currentSubject = "All";
let showingSaved = false;
let savedQuestions = JSON.parse(localStorage.getItem('savedQuestions') || '[]');

const container = document.getElementById('quiz-content');
const filterBar = document.getElementById('filter-bar');

// ── Toast ──────────────────────────────────────────────────────────────
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Saved badge ────────────────────────────────────────────────────────
function updateSavedBadge() {
    const badge = document.getElementById('saved-count-badge');
    const count = savedQuestions.length;
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline-block' : 'none';
}

// ── Saved filter toggle ────────────────────────────────────────────────
// Instead of opening a panel, pressing Saved filters questions in-place.
function toggleSavedFilter() {
    showingSaved = !showingSaved;
    const btn = document.getElementById('saved-toggle-btn');

    if (showingSaved) {
        btn.classList.add('saved-active');
        // Deactivate subject filters
        currentSubject = "All";
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.filter-btn')?.classList.add('active'); // keep "All" visually neutral
    } else {
        btn.classList.remove('saved-active');
    }

    handleSearch();
}

// ── Save / Unsave a question ───────────────────────────────────────────
function saveQuestion(qn) {
    const item = allQuestions.find(q => q.n === qn);
    if (!item) return;
    const alreadySaved = savedQuestions.some(q => q.n === qn);

    if (alreadySaved) {
        savedQuestions = savedQuestions.filter(q => q.n !== qn);
        localStorage.setItem('savedQuestions', JSON.stringify(savedQuestions));
        updateSavedBadge();
        document.querySelectorAll('.q-block').forEach(block => {
            if (parseInt(block.dataset.qn) === qn) block.classList.remove('is-saved');
        });
        showToast('Removed from saved');
    } else {
        savedQuestions.push({ n: item.n, q: item.q });
        localStorage.setItem('savedQuestions', JSON.stringify(savedQuestions));
        updateSavedBadge();
        document.querySelectorAll('.q-block').forEach(block => {
            if (parseInt(block.dataset.qn) === qn) block.classList.add('is-saved');
        });
        showToast('✓ Question saved');
    }

    // If we're currently in saved-filter mode, refresh visibility
    if (showingSaved) handleSearch();

    // Refresh dropdown save label if open
    const openDropdown = document.querySelector('.dots-dropdown.open');
    if (openDropdown) {
        const blockEl = openDropdown.closest('.q-block');
        if (blockEl && parseInt(blockEl.dataset.qn) === qn) {
            updateDropdownSaveLabel(openDropdown, qn);
        }
    }
}

function updateDropdownSaveLabel(dropdown, qn) {
    const isSaved = savedQuestions.some(q => q.n === qn);
    const saveLabel = dropdown.querySelector('.save-label');
    const saveIconPath = dropdown.querySelector('.save-icon-path');
    if (saveLabel) saveLabel.textContent = isSaved ? 'Unsave' : 'Save';
    if (saveIconPath) {
        saveIconPath.setAttribute('fill', isSaved ? 'currentColor' : 'none');
    }
}

// ── Copy question ──────────────────────────────────────────────────────
function copyQuestion(qn) {
    const item = allQuestions.find(q => q.n === qn);
    if (!item) return;
    const text = `Q${item.n}. ${item.q}\n${item.o.join('\n')}\nAnswer: ${item.a}`;
    navigator.clipboard.writeText(text).then(() => {
        showToast('✓ Copied to clipboard');
    }).catch(() => {
        showToast('Copy failed');
    });
}

// ── Dots menu ──────────────────────────────────────────────────────────
function toggleDots(btn, qn) {
    document.querySelectorAll('.dots-dropdown.open').forEach(d => {
        if (d !== btn.nextElementSibling) d.classList.remove('open');
    });
    const dropdown = btn.nextElementSibling;
    dropdown.classList.toggle('open');
    if (dropdown.classList.contains('open')) {
        updateDropdownSaveLabel(dropdown, qn);
    }
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.dots-menu-wrapper')) {
        document.querySelectorAll('.dots-dropdown.open').forEach(d => d.classList.remove('open'));
    }
});

// ── Filter bar ─────────────────────────────────────────────────────────
function renderFilterBar() {
    filterBar.innerHTML = filterLectures.map(f =>
        `<button class="filter-btn${f.val === currentSubject && !showingSaved ? " active" : ""}" onclick="filterBySubject('${f.val}', this)">${f.label}</button>`
    ).join('');
}

function getLectureLabel(val) {
    if (showingSaved) return "Saved Questions";
    if (val === "All") return "All";
    const found = filterLectures.find(f => f.val === val);
    return found ? found.label : val;
}

function updateSectionHeading() {
    const existing = document.getElementById('section-heading');
    const visibleBlocks = [...document.querySelectorAll('.q-block')].filter(b => b.style.display !== "none");
    const count = visibleBlocks.length;

    let noResultsMsg = document.getElementById('no-results-msg');
    if (count === 0) {
        if (!noResultsMsg) {
            noResultsMsg = document.createElement('div');
            noResultsMsg.id = 'no-results-msg';
            noResultsMsg.className = 'no-results';
            noResultsMsg.textContent = showingSaved ? "No saved questions yet." : "No questions found.";
            container.appendChild(noResultsMsg);
        } else {
            noResultsMsg.textContent = showingSaved ? "No saved questions yet." : "No questions found.";
        }
    } else if (noResultsMsg) {
        noResultsMsg.remove();
    }

    const label = getLectureLabel(currentSubject);
    const badgeText = count === 1 ? "1 MCQ" : `${count} MCQs`;

    if (existing) {
        existing.style.display = (count === 0) ? "none" : "flex";
        existing.querySelector('.section-heading-title').textContent = label;
        existing.querySelector('.mcq-count-badge').textContent = badgeText;
    } else if (count > 0) {
        const heading = document.createElement('div');
        heading.id = 'section-heading';
        heading.className = 'section-heading';
        heading.innerHTML = `<span class="section-heading-title">${label}</span><span class="mcq-count-badge">${badgeText}</span>`;
        container.insertBefore(heading, container.firstChild);
    }
}

// ── Render questions ───────────────────────────────────────────────────
function renderQuiz() {
    container.innerHTML = '';
    allQuestions.forEach(item => {
        const div = document.createElement('div');
        div.className = 'q-block';
        div.dataset.lecture = item.s;
        div.dataset.qn = item.n;
        div.dataset.searchText = (item.q + " " + item.o.join(" ")).toLowerCase();

        const matchesSubject = currentSubject === "All" || item.s === currentSubject;
        div.style.display = matchesSubject ? "block" : "none";

        if (savedQuestions.some(q => q.n === item.n)) div.classList.add('is-saved');

        const isSaved = savedQuestions.some(q => q.n === item.n);

        div.innerHTML = `
            <div class="q-header">
                <div class="q-text" data-original="${item.n}. ${item.q}">${item.n}. ${item.q}</div>
                <div class="dots-menu-wrapper">
                    <button class="dots-btn" onclick="toggleDots(this, ${item.n})" title="Options">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="5" r="1.5"></circle>
                            <circle cx="12" cy="12" r="1.5"></circle>
                            <circle cx="12" cy="19" r="1.5"></circle>
                        </svg>
                    </button>
                    <div class="dots-dropdown">
                        <button class="dots-dropdown-item" onclick="copyQuestion(${item.n}); this.closest('.dots-dropdown').classList.remove('open');">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            Copy
                        </button>
                        <div class="dots-divider"></div>
                        <button class="dots-dropdown-item" onclick="saveQuestion(${item.n}); this.closest('.dots-dropdown').classList.remove('open');">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path class="save-icon-path" d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" fill="${isSaved ? 'currentColor' : 'none'}"></path>
                            </svg>
                            <span class="save-label">${isSaved ? 'Unsave' : 'Save'}</span>
                        </button>
                    </div>
                </div>
            </div>
            <ul class="opts">
                ${item.o.map(opt => `<li data-original="${opt}">${opt}</li>`).join('')}
            </ul>
            <div class="ans-row">
                <button class="ans-btn" data-answer="Answer: ${item.a}" onclick="toggleAnswer(this)">Answer</button>
            </div>
        `;
        container.appendChild(div);
    });
    updateSectionHeading();
}

function filterBySubject(val, btn) {
    // Exit saved-filter mode when a category is picked
    if (showingSaved) {
        showingSaved = false;
        document.getElementById('saved-toggle-btn').classList.remove('saved-active');
    }
    currentSubject = val;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    handleSearch();
}

function handleSearch() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const blocks = document.querySelectorAll('.q-block');

    blocks.forEach(block => {
        resetBlock(block);
        const qn = parseInt(block.dataset.qn);

        let visible = false;

        if (showingSaved) {
            // Only show saved questions
            const isSaved = savedQuestions.some(q => q.n === qn);
            const matchesSearch = term === "" || block.dataset.searchText.includes(term);
            visible = isSaved && matchesSearch;
        } else {
            const matchesCategory = currentSubject === "All" || block.dataset.lecture === currentSubject;
            const matchesSearch = term === "" || block.dataset.searchText.includes(term);
            visible = matchesCategory && matchesSearch;
        }

        block.style.display = visible ? "block" : "none";
        if (visible && term !== "") highlight(block, term);
    });

    updateSectionHeading();
}

function resetBlock(block) {
    const qText = block.querySelector('.q-text');
    const opts = block.querySelectorAll('li');
    qText.innerHTML = qText.dataset.original;
    opts.forEach(li => li.innerHTML = li.dataset.original);
    block.classList.remove('revealed');
    const btn = block.querySelector('.ans-btn');
    if (btn && btn.dataset.answer) btn.textContent = 'Answer';
}

function highlight(block, term) {
    const regex = new RegExp(`(${term})`, 'gi');
    block.querySelector('.q-text').innerHTML = block.querySelector('.q-text').innerHTML.replace(regex, '<mark>$1</mark>');
    block.querySelectorAll('li').forEach(li => li.innerHTML = li.innerHTML.replace(regex, '<mark>$1</mark>'));
}

function toggleAnswer(btn) {
    const block = btn.closest('.q-block');
    const isRevealed = block.classList.toggle('revealed');
    btn.textContent = isRevealed ? btn.dataset.answer : 'Answer';
}

function toggleTheme() {
    const isLight = document.body.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? '' : 'light';
    document.body.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.getElementById('theme-icon').innerHTML = isLight 
        ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
}

(function () {
    if (localStorage.getItem('theme') === 'light') {
        document.body.setAttribute('data-theme', 'light');
        document.getElementById('theme-icon').innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
    updateSavedBadge();
}());

renderFilterBar();
renderQuiz();
</script>
</body>
</html>
